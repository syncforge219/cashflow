name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Check SSH connectivity
      # ============================================================
      - name: Check SSH Port Reachability
        shell: bash
        run: |
          set -euo pipefail

          TARGET_HOST="${{ secrets.HOST }}"
          TARGET_PORT="${{ secrets.PORT || '22' }}"

          echo "========================================="
          echo "🔍 Checking VPS Connectivity"
          echo "========================================="

          echo "Host: $TARGET_HOST"
          echo "Port: $TARGET_PORT"

          if nc -z -w 10 "$TARGET_HOST" "$TARGET_PORT"; then
            echo "✅ VPS is reachable."
          else
            echo "❌ VPS is not reachable."
            echo "Check HOST, PORT, VPS status and firewall."
            exit 1
          fi


      # ============================================================
      # 2. Prepare SSH private key
      # ============================================================
      - name: Prepare SSH Key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/cashflow_deploy"

          echo "========================================="
          echo "🔐 Preparing SSH Key"
          echo "========================================="

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"

          chmod 600 "$KEY_FILE"

          echo "🔍 Validating SSH private key..."

          ssh-keygen -y \
            -f "$KEY_FILE" \
            > "$RUNNER_TEMP/cashflow_deploy.pub"

          echo "✅ SSH private key is valid."

          echo "🔑 SSH key fingerprint:"

          ssh-keygen -lf "$RUNNER_TEMP/cashflow_deploy.pub"


      # ============================================================
      # 3. Deploy to VPS
      # ============================================================
      - name: Deploy over SSH
        shell: bash
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT || '22' }}
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/cashflow_deploy"

          echo "========================================="
          echo "🚀 Connecting to VPS"
          echo "========================================="

          echo "Host: $HOST"
          echo "Username: root"
          echo "Port: $PORT"

          ssh \
            -i "$KEY_FILE" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "root@$HOST" 'bash -s' <<'REMOTE_SCRIPT'

          set -e

          echo "========================================="
          echo "🚀 Starting Deployment"
          echo "========================================="

          # ========================================================
          # Server information
          # ========================================================

          echo "🖥️ Server:"
          hostname

          echo "📅 Time:"
          date

          # ========================================================
          # Application directory
          # ========================================================

          echo "📂 Switching to project directory..."

          cd /var/www/cashflow

          echo "📍 Current Directory:"
          pwd

          # ========================================================
          # Git
          # ========================================================

          echo "🌿 Current Branch:"
          git branch --show-current

          echo "🔄 Fetching latest code..."

          git fetch origin

          echo "📥 Pulling latest changes..."

          git pull --ff-only origin main

          # ========================================================
          # Node.js
          # ========================================================

          echo "🟢 Node Version:"
          node -v

          echo "📦 NPM Version:"
          npm -v

          # ========================================================
          # Install dependencies
          # ========================================================

          echo "📦 Installing dependencies..."

          npm install

          # ========================================================
          # Build application
          # ========================================================

          echo "🏗️ Building application..."

          npm run build

          # ========================================================
          # PM2
          # ========================================================

          echo "♻️ Reloading PM2..."

          pm2 reload next-app

          echo "💾 Saving PM2 process list..."

          pm2 save

          # ========================================================
          # Nginx
          # ========================================================

          echo "🔧 Configuring Nginx client_max_body_size..."

          sudo sed -i \
            's/client_max_body_size.*/client_max_body_size 50M;/g' \
            /etc/nginx/nginx.conf \
            /etc/nginx/conf.d/*.conf \
            /etc/nginx/sites-available/* \
            2>/dev/null || true

          if ! grep -q "client_max_body_size" /etc/nginx/nginx.conf 2>/dev/null; then

            sudo sed -i \
              '/http {/a \    client_max_body_size 50M;' \
              /etc/nginx/nginx.conf \
              2>/dev/null || true

          fi

          echo "🔄 Reloading Nginx..."

          sudo systemctl reload nginx 2>/dev/null || true

          # ========================================================
          # PM2 status
          # ========================================================

          echo "📋 PM2 Status:"

          pm2 list

          # ========================================================
          # Deployment complete
          # ========================================================

          echo "========================================="
          echo "✅ Deployment Successful"
          echo "========================================="

          REMOTE_SCRIPT
