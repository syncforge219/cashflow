      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cashflow_deploy"

          chmod 600 "$RUNNER_TEMP/cashflow_deploy"

          echo "Validating SSH private key..."

          ssh-keygen -y -f "$RUNNER_TEMP/cashflow_deploy" > /dev/null

          echo "✅ SSH private key is valid."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key_path: ${{ runner.temp }}/cashflow_deploy
          port: ${{ secrets.PORT || '22' }}
          timeout: 120s
          command_timeout: 30m
          debug: true

          script: |
            set -e

            echo "========================================="
            echo "🚀 Starting Deployment"
            echo "========================================="

            echo "🖥️ Server:"
            hostname

            echo "📅 Time:"
            date

            echo "📂 Switching to project directory..."
            cd /var/www/cashflow

            echo "📍 Current Directory:"
            pwd

            echo "🌿 Current Branch:"
            git branch --show-current

            echo "🔄 Fetching latest code..."
            git fetch origin

            echo "📥 Pulling latest changes..."
            git pull --ff-only origin main

            echo "🟢 Node Version:"
            node -v

            echo "📦 NPM Version:"
            npm -v

            echo "📦 Installing dependencies..."
            npm install

            echo "🏗️ Building application..."
            npm run build

            echo "♻️ Reloading PM2..."
            pm2 reload next-app

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "🔧 Configuring Nginx client_max_body_size..."
            sudo sed -i 's/client_max_body_size.*/client_max_body_size 50M;/g' /etc/nginx/nginx.conf /etc/nginx/conf.d/*.conf /etc/nginx/sites-available/* 2>/dev/null || true

            if ! grep -q "client_max_body_size" /etc/nginx/nginx.conf 2>/dev/null; then
              sudo sed -i '/http {/a \    client_max_body_size 50M;' /etc/nginx/nginx.conf 2>/dev/null || true
            fi

            sudo systemctl reload nginx 2>/dev/null || true

            echo "📋 PM2 Status:"
            pm2 list

            echo "========================================="
            echo "✅ Deployment Successful"
            echo "========================================="
