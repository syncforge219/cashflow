name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH Port Reachability
        run: |
          TARGET_HOST="${{ secrets.HOST }}"
          TARGET_PORT="${{ secrets.PORT || '22' }}"
          echo "🔍 Testing TCP connectivity to Host: $TARGET_HOST on Port: $TARGET_PORT..."
          if nc -z -w 10 "$TARGET_HOST" "$TARGET_PORT"; then
            echo "✅ Server $TARGET_HOST is reachable on port $TARGET_PORT."
          else
            echo "❌ ERROR: Cannot establish TCP connection to $TARGET_HOST:$TARGET_PORT"
            echo "👉 Please check the following in Hostinger Control Panel & VPS:"
            echo "   1. Ensure VPS is running and server is online."
            echo "   2. Check Firewall / UFW allows inbound TCP on port $TARGET_PORT."
            echo "   3. Verify repository secret HOST is public IP (not 127.0.0.1 or internal IP)."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT || '22' }}

          # Connection Settings
          timeout: 120s
          command_timeout: 30m
          debug: true

          script: |
            set -e

            echo "========================================="
            echo "🚀 Starting Deployment"
            echo "========================================="

            echo "🖥️ Server:"
            hostname

            echo "📅 Time:"
            date

            echo "📂 Switching to project directory..."
            cd /var/www/cashflow

            echo "📍 Current Directory:"
            pwd

            echo "🌿 Current Branch:"
            git branch --show-current

            echo "🔄 Fetching latest code..."
            git fetch origin

            echo "📥 Pulling latest changes..."
            git pull --ff-only origin main

            echo "🟢 Node Version:"
            node -v

            echo "📦 NPM Version:"
            npm -v

            echo "📦 Installing dependencies..."
            npm ci

            echo "🏗️ Building application..."
            npm run build

            echo "♻️ Reloading PM2..."
            pm2 reload next-app

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "📋 PM2 Status:"
            pm2 list

            echo "========================================="
            echo "✅ Deployment Successful"
            echo "========================================="